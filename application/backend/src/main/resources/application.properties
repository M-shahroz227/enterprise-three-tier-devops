spring.application.name=enterprise-backend

server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:enterprise_db}
spring.datasource.username=${DB_USER:enterprise_user}
spring.datasource.password=${DB_PASSWORD:enterprise_password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Boot Actuator and Prometheus Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=Enterprise Three Tier Backend
info.app.description=Enterprise DevOps Application
info.app.version=1.0.0

spring.jpa.open-in-view=false
